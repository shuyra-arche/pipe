[package]
name = "pipe-tests"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone host workspace: `cargo test --manifest-path tests/Cargo.toml
# --target x86_64-unknown-linux-gnu`. The server modules are projected with
# `#[path]` from this same repository; no Source path is used.
[workspace]

[lib]
path = "lib.rs"

[dependencies]
pipe-api = { path = "../api" }
pipe-declaration = { path = "../declaration" }
env = { git = "https://github.com/shuyra-arche/env.git", rev = "d3000253cd5d13d466e91fafd4dbb27a5ec5aaae" }
unit = { git = "https://github.com/shuyra-arche/unit.git", rev = "90396f0fda376e0693fb1b9553aa21864d241057" }
wire = { git = "https://github.com/shuyra-arche/wire.git", rev = "0ff77dc4573fa2620d2fe995a18c01949d9c7e57" }
stream = { git = "https://github.com/shuyra-arche/stream.git", rev = "ebd1c6db4823e28591650d967d7e8c8dd1939687" }
system-api = { git = "https://github.com/shuyra-arche/system.git", rev = "9e5d63ca536a176583cf1b0054b4ecf7ddd88257" }
